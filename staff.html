<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="robots" content="noindex">
<title>Staff do placar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="placar.js"></script>
<style>
  :root{
    --bg:#05070a; --txt:#eef2f6; --mut:#8590a0; --mut2:#4b5463;
    --vidro:rgba(255,255,255,.04); --linha:rgba(255,255,255,.09);
    --a:#3a8dff; --a1:#1f5bff; --a2:#45d2ff;
    --b:#22d47e; --b1:#0db464; --b2:#a6ee52;
    --verm:#ff3b4a;
  }
  [data-eq="a"]{--c:var(--a);--c1:var(--a1);--c2:var(--a2)}
  [data-eq="b"]{--c:var(--b);--c1:var(--b1);--c2:var(--b2)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{min-height:100vh;min-height:100dvh;color:var(--txt);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
    touch-action:manipulation;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    background:radial-gradient(90vw 50vh at 0% 0%,rgba(31,91,255,.16),transparent 70%),
               radial-gradient(90vw 50vh at 100% 100%,rgba(13,180,100,.14),transparent 70%),var(--bg);
    background-attachment:fixed}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  a{color:inherit}
  :focus-visible{outline:2px solid #fff;outline-offset:2px}

  .barra{max-width:520px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .barra b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conn{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
  .conn i{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
  .conn.online i{background:#34d27b}
  .conn.offline i,.conn.negado i{background:var(--verm)}
  .conn.demo i{background:#f5b83d}
  main{max-width:520px;margin:0 auto;padding:10px 16px 48px}

  .msg{padding:48px 8px;text-align:center;color:var(--mut);line-height:1.5}
  .msg b{display:block;color:var(--txt);font-size:18px;margin-bottom:8px}
  .demo-nota{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;color:#f5d28a;
    background:rgba(245,184,61,.08);border:1px solid rgba(245,184,61,.25)}

  /* início */
  .pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pm{position:relative;overflow:hidden;border-radius:20px;padding:14px 16px 12px;background:var(--vidro);border:1px solid var(--linha)}
  .pm::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .pm-nome{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pm-n{display:block;font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
  .sec{font-size:14px;font-weight:600;color:var(--mut);margin:24px 2px 10px}
  .sec.verm{color:var(--verm)}
  .lista{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--vidro);border:1px solid var(--linha);text-decoration:none}
  .item.vivo{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.07)}
  .it-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .it-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-txt small{font-size:12px;color:var(--mut)}
  .item.vivo small{color:var(--txt)}
  .it-pts{display:flex;gap:6px;flex:none}
  .it-pts i{font-style:normal;font-weight:700;font-size:17px;min-width:44px;text-align:center;padding:6px 8px;border-radius:10px;
    color:var(--c2);background:color-mix(in srgb,var(--c) 15%,transparent)}
  .vazio{color:var(--mut);font-size:14px;padding:12px 2px;line-height:1.45}
  .novo{display:flex;gap:8px;margin-top:10px}
  .inp{flex:1;min-width:0;width:100%;height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--linha);background:rgba(255,255,255,.05);font-size:16px}
  .inp::placeholder{color:#5d6675}
  .btn-claro{flex:none;height:50px;padding:0 18px;border-radius:14px;background:#eef2f6;color:#05070a;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .btn-vidro{display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;background:var(--vidro);border:1px solid var(--linha);font-weight:600;text-decoration:none}
  .btn-penal{display:flex;align-items:center;justify-content:center;height:58px;margin-top:22px;border-radius:16px;border:1.5px solid var(--verm);
    background:rgba(255,59,74,.08);color:var(--verm);font-weight:600;text-decoration:none;box-shadow:0 0 30px -14px rgba(255,59,74,.85)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

  /* telas internas */
  .topo{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px}
  .voltar{color:var(--mut);text-decoration:none;font-size:15px;padding:10px 12px 10px 0}
  .link{color:var(--mut);font-size:14px;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
  .titulo-tela{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
  .titulo-tela.verm{color:var(--verm)}
  .dica{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-top:14px;border-radius:14px;background:var(--vidro);border:1px solid var(--linha)}
  .seg button{height:42px;border-radius:10px;font-size:14px;color:var(--mut)}
  .seg button.on{background:rgba(255,255,255,.12);color:var(--txt);font-weight:600}
  .seg button.on[data-st="ao_vivo"]{background:#eef2f6;color:#05070a}
  .pj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .pj-eq{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--linha)}
  .pj-nome{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pj-n{font-size:26px;font-weight:700;color:var(--c2);font-variant-numeric:tabular-nums}
  .eq-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .eq-sel button{height:60px;padding:0 10px;border-radius:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:2px solid color-mix(in srgb,var(--c) 45%,transparent);transition:background .15s,box-shadow .15s}
  .eq-sel button.on{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;color:#05070a;box-shadow:0 10px 30px -12px var(--c)}
  .pend{display:flex;flex-direction:column;align-items:center;margin:18px 0 12px}
  .pend b{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--c2);font-variant-numeric:tabular-nums}
  .pend.zero b{color:var(--mut2)}
  .pend.penal b{color:var(--verm)}
  .pend.penal.zero b{color:var(--mut2)}
  .pend b.pop{animation:pop .22s ease-out}
  .pend .expr{font-size:14px;color:var(--mut);min-height:20px;margin-top:8px;font-variant-numeric:tabular-nums}
  .pend .para{font-size:14px;color:var(--mut)}
  .teclado{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .teclado button{height:62px;border-radius:14px;background:var(--vidro);border:1px solid var(--linha);font-size:20px;font-weight:600;
    font-variant-numeric:tabular-nums;transition:transform .08s,background .08s}
  .teclado button:active{transform:scale(.93);background:rgba(255,255,255,.12)}
  .teclado.penal button{color:#ff8a93;border-color:rgba(255,59,74,.25);background:rgba(255,59,74,.06)}
  .teclado.penal button:active{background:rgba(255,59,74,.18)}
  .acoes{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
  .acoes .btn-vidro{height:60px}
  .btn-conf{height:60px;border-radius:16px;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#05070a;transition:opacity .15s}
  .btn-conf.penal{background:var(--verm);color:#fff}
  .btn-conf:disabled{opacity:.3}
  .lanc{display:flex;flex-direction:column;gap:6px}
  .ln{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--linha)}
  .ln>b{min-width:46px;font-size:18px;font-weight:700;color:var(--c2);font-variant-numeric:tabular-nums}
  .ln>b.neg{color:var(--verm)}
  .ln-txt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
  .ln-txt small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ln button{flex:none;font-size:13px;color:var(--mut);padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
  .perigo{display:block;width:100%;height:50px;margin-top:12px;border-radius:14px;border:1px dashed rgba(255,59,74,.45);color:#ff7c86;font-size:14px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--linha);background:var(--vidro);font-size:14px;color:var(--mut);white-space:nowrap}
  .chips button.on{background:rgba(255,59,74,.14);border-color:var(--verm);color:var(--txt)}
  .chips.motivos{margin-top:8px}

  /* ajustes */
  .campo{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .campo>span{font-size:13px;color:var(--mut)}
  .campo .inp,#motivo{flex:none}
  .cfg-eq{margin-top:18px;padding:16px;border-radius:18px;border:1px solid var(--linha);background:var(--vidro)}
  .cfg-cab{display:flex;align-items:center;gap:10px;font-weight:600}
  .dot{width:12px;height:12px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .logo-linha{display:flex;align-items:center;gap:12px;margin-top:14px}
  .logo-prev{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(135deg,var(--c1),var(--c2));color:#05070a;font-weight:700;font-size:22px}
  .logo-prev.img{background:rgba(255,255,255,.06)}
  .logo-prev img{width:100%;height:100%;object-fit:contain}
  .arquivo{flex:1;height:46px;padding:0 14px}
  .links{display:flex;flex-direction:column;gap:10px}
  .lk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--linha);background:var(--vidro)}
  .lk span{font-size:13px;color:var(--mut)}
  .lk code{grid-column:1;font-size:12px;word-break:break-all;font-family:inherit}
  .lk button{grid-row:1/3;grid-column:2;height:40px;padding:0 14px;border-radius:10px;background:#eef2f6;color:#05070a;font-weight:600;font-size:14px}

  /* cronômetro */
  .btn-rel{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px;margin-top:22px;padding:0 18px;border-radius:16px;
    background:var(--vidro);border:1px solid var(--linha);font-weight:600;text-decoration:none}
  .btn-rel small{font-size:15px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
  .btn-rel small.ativo{color:#34d27b}
  .btn-rel+.btn-penal{margin-top:10px}
  .seg.seg2{grid-template-columns:1fr 1fr}
  .r-visor{margin-top:16px;padding:22px 18px 18px;border-radius:22px;border:1px solid var(--linha);background:var(--vidro);
    display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .3s}
  .r-t{display:flex;align-items:baseline;line-height:1}
  .r-t b{font-size:76px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .3s,opacity .3s}
  .r-t small{font-size:32px;font-weight:600;color:var(--mut);margin-left:2px;font-variant-numeric:tabular-nums}
  .r-est{font-size:13px;color:var(--mut);min-height:18px;text-align:center}
  .r-barra{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .r-barra i{display:block;height:100%;width:100%;border-radius:inherit;background:#eef2f6;transform-origin:left center}
  .r-visor.cron .r-barra{display:none}
  .r-visor.pausado b{opacity:.5}
  .r-visor.alerta b{color:var(--verm)}
  .r-visor.alerta .r-barra i{background:var(--verm)}
  .r-visor.fim{border-color:var(--verm);background:rgba(255,59,74,.08)}
  .r-visor.fim b{color:var(--verm)}
  .r-visor.fim .r-est{color:var(--verm);font-weight:600}
  .btn-play{height:60px;border-radius:16px;font-weight:700;font-size:17px;background:#eef2f6;color:#05070a}
  .btn-play.pausar{background:rgba(245,184,61,.1);border:2px solid #f5b83d;color:#f5b83d}
  .btn-vidro:disabled{opacity:.35}
  .r-ajuste{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .r-ajuste button{height:46px;border-radius:12px;background:var(--vidro);border:1px solid var(--linha);font-size:15px;font-weight:600}
  .r-ajuste button:active{background:rgba(255,255,255,.12)}
  .chips.r-presets{flex-wrap:wrap;overflow:visible}
  .r-presets button.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);color:var(--txt)}
  .r-custom{display:grid;grid-template-columns:1fr auto 1fr auto auto;align-items:center;gap:8px;margin-top:10px}
  .r-custom span{font-size:14px;color:var(--mut)}
  .r-custom .inp{text-align:center;padding:0 6px}
  .r-tela{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding:14px 16px;border-radius:16px;
    border:1px solid var(--linha);background:var(--vidro);cursor:pointer}
  .r-tela>span{display:flex;flex-direction:column;gap:3px}
  .r-tela small{font-size:12px;color:var(--mut);line-height:1.4}
  .r-tela input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:52px;height:30px;border-radius:99px;
    background:rgba(255,255,255,.14);transition:background .2s;cursor:pointer}
  .r-tela input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
  .r-tela input:checked{background:#34d27b}
  .r-tela input:checked::after{transform:translateX(22px)}

  /* barra fixa do cronômetro nas outras telas */
  .mini-rel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;
    width:calc(100% - 24px);max-width:496px;height:62px;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;border-radius:18px;
    background:rgba(18,21,28,.94);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 40px -12px rgba(0,0,0,.8);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .mini-rel[hidden]{display:none}
  .mr-abrir{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left}
  .mr-abrir small{font-size:13px;color:var(--mut)}
  .mr-abrir b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .mini-rel.alerta .mr-abrir b,.mini-rel.fim .mr-abrir b{color:var(--verm)}
  .mini-rel .btn-play{height:46px;padding:0 16px;font-size:15px;border-radius:12px}
  body.tem-mini main{padding-bottom:100px}

  #toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;
    width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;padding:12px 12px 12px 18px;border-radius:16px;
    background:#eef2f6;color:#05070a;font-size:15px;font-weight:600;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);animation:toast .25s ease-out}
  #toast[hidden]{display:none}
  #toast button{flex:none;padding:9px 12px;border-radius:10px;background:#05070a;color:#fff;font-size:14px;font-weight:600}

  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:none}}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}100%{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="barra"><b id="titulo">Placar</b><span class="conn" id="conn"><i></i><span>Conectando</span></span></header>
<main id="app"><div class="msg">Conectando ao placar…</div></main>
<div class="mini-rel" id="mini-rel" hidden>
  <button type="button" class="mr-abrir" id="mr-abrir"><small id="mr-modo">Cronômetro</small><b id="mr-t">00:00</b></button>
  <button type="button" class="btn-play" id="mr-play">Pausar</button>
</div>
<div id="toast" hidden></div>

<script>
(function () {
  "use strict";
  const P = window.Placar;
  const EQ = P.EQ;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const app = $("#app");

  let loja = null, E = null, C = null, rota = null, tela = null, tk = null, jaConectou = false;
  const ui = { eq: "a", penJogo: "", chipsChave: "" };
  const meuNome = () => { try { return localStorage.getItem("placar:nome") || ""; } catch (e) { return ""; } };
  const nomeEq = (k) => E.config.equipes[k].nome;
  const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  const reiniciar = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  /* ---------- aviso rápido com opção de desfazer ---------- */
  let tToast;
  function toast(txt, desfazer) {
    const t = $("#toast");
    t.innerHTML = "<span></span>" + (desfazer ? '<button type="button">Desfazer</button>' : "");
    t.firstChild.textContent = txt;
    t.hidden = false;
    reiniciar(t, "x");
    if (desfazer) t.querySelector("button").onclick = () => { desfazer(); vibrar(15); toast("Desfeito"); };
    clearTimeout(tToast);
    tToast = setTimeout(() => (t.hidden = true), desfazer ? 6000 : 2200);
  }
  async function copiar(txt) {
    try { await navigator.clipboard.writeText(txt); toast("Link copiado"); }
    catch (e) { prompt("Copie o link:", txt); }
  }

  /* ---------- peças reutilizadas ---------- */
  function statusTxt(j) {
    if (j.id === C.aoVivo) return "Ao vivo no telão";
    if (j.status === "encerrado") return j.vencedor ? "Encerrada, vitória de " + nomeEq(j.vencedor) : "Encerrada, empate";
    return "Aguardando";
  }
  function linhaLanc(l, comJogo) {
    const jogo = l.jogo && E.jogos[l.jogo] ? E.jogos[l.jogo].nome : "Geral";
    const info = [P.hora(l.ts), comJogo ? jogo : "", l.motivo, l.por ? "por " + l.por : ""].filter(Boolean).map(P.esc).join(", ");
    return `<div class="ln" data-eq="${l.equipe}"><b class="${l.pontos < 0 ? "neg" : ""}">${P.sinal(l.pontos)}</b>` +
      `<span class="ln-txt">${P.esc(nomeEq(l.equipe))}<small>${info}</small></span>` +
      `<button type="button" data-del="${P.esc(l.id)}">Desfazer</button></div>`;
  }
  function desfazerClique(e) {
    const b = e.target.closest("[data-del]");
    if (b && confirm("Desfazer este lançamento? Os pontos saem do placar.")) { loja.desfazer(b.dataset.del); toast("Desfeito"); }
  }
  function logoPrev(el, eq) {
    const chave = eq.logo ? "img:" + eq.logo.length + eq.logo.slice(-24) : "txt:" + eq.nome;
    if (el.dataset.k === chave) return;
    el.dataset.k = chave;
    if (eq.logo) { el.classList.add("img"); el.innerHTML = '<img alt="">'; el.firstChild.src = eq.logo; }
    else { el.classList.remove("img"); el.textContent = (eq.nome.trim()[0] || "?").toUpperCase(); }
  }
  const htmlSelEquipe = () => '<div class="eq-sel">' + EQ.map((k) => `<button type="button" data-eq="${k}" data-sel="${k}"></button>`).join("") + "</div>";
  const htmlTeclado = (neg) => `<div class="teclado${neg ? " penal" : ""}">` +
    Array.from({ length: 10 }, (_, i) => `<button type="button" data-n="${i + 1}">${neg ? "\u2212" : "+"}${i + 1}</button>`).join("") + "</div>";

  /* Teclado de somatória: +1..+10 acumulam, Apagar tira o último toque, Confirmar envia */
  function ligarTeclado(neg, extras) {
    const st = { termos: [] };
    const soma = () => st.termos.reduce((a, b) => a + b, 0);
    const sel = $(".eq-sel", app), pend = $("#pend"), num = $("#pend-n"), conf = $("#confirmar");
    const S = neg ? "\u2212" : "+";
    function render() {
      const s = soma();
      $$("[data-sel]", sel).forEach((b) => { b.classList.toggle("on", b.dataset.sel === ui.eq); b.textContent = nomeEq(b.dataset.sel); });
      pend.dataset.eq = ui.eq;
      conf.dataset.eq = ui.eq;
      pend.classList.toggle("zero", !s);
      num.textContent = S + s;
      $("#pend-expr").textContent = st.termos.length > 1 ? st.termos.join(" + ") : "";
      $("#pend-para").textContent = "para " + nomeEq(ui.eq);
      conf.disabled = !s;
      conf.textContent = s ? "Confirmar " + S + s : "Confirmar";
    }
    sel.onclick = (e) => {
      const b = e.target.closest("[data-sel]");
      if (!b) return;
      ui.eq = b.dataset.sel;
      vibrar(8);
      render();
    };
    $(".teclado", app).onclick = (e) => {
      const b = e.target.closest("[data-n]");
      if (!b) return;
      const n = Number(b.dataset.n);
      if (soma() + n > 500) { toast("Limite de 500 por lançamento"); return; }
      st.termos.push(n);
      vibrar(10);
      render();
      reiniciar(num, "pop");
    };
    $("#apagar").onclick = () => { st.termos.pop(); vibrar(8); render(); };
    conf.onclick = () => {
      const s = soma();
      if (!s) return;
      const pontos = neg ? -s : s, eq = ui.eq;
      const id = loja.lancar({ equipe: eq, pontos, tipo: neg ? "penal" : "ponto", jogo: extras.jogo(), motivo: extras.motivo ? extras.motivo() : "", por: meuNome() });
      st.termos = [];
      render();
      vibrar([18, 40, 18]);
      if (extras.depois) extras.depois();
      toast((neg ? "Penalização confirmada: " : "Confirmado: ") + P.sinal(pontos) + " para " + nomeEq(eq), () => loja.desfazer(id));
    };
    render();
    return { render };
  }

  /* ---------- cronômetro: ação principal, atualização contínua e barra fixa ---------- */
  function acaoRelogio(t) {
    if (t.acabou) return { rotulo: "Reiniciar", pausar: false, fn: () => loja.relogioIniciar() };
    if (t.rodando) return { rotulo: "Pausar", pausar: true, fn: () => loja.relogioPausar() };
    if (t.estado === "pausado") return { rotulo: "Continuar", pausar: false, fn: () => loja.relogioIniciar() };
    return { rotulo: "Iniciar", pausar: false, fn: () => loja.relogioIniciar() };
  }
  function pintarPlay(b, a) {
    if (b.textContent !== a.rotulo) b.textContent = a.rotulo;
    b.classList.toggle("pausar", a.pausar);
  }

  let rSeg = null, rChave = "";
  function tickRelogio() {
    if (!E || !loja) return;
    const r = E.relogio, t = P.tempoRelogio(r, loja.agora()), f = P.fmtRelogio(t.valor, t.modo);
    const alerta = t.modo === "temporizador" && t.rodando && !t.acabou && t.valor <= 10000;
    const a = acaoRelogio(t);

    // tela do cronômetro
    const visor = $("#r-visor");
    if (visor) {
      $("#r-tempo").textContent = f.txt;
      $("#r-dec").textContent = f.dec ? "," + f.dec : "";
      visor.classList.toggle("cron", t.modo !== "temporizador");
      visor.classList.toggle("alerta", alerta);
      visor.classList.toggle("fim", t.acabou);
      visor.classList.toggle("pausado", t.estado === "pausado" && !t.acabou);
      $("#r-barra").style.transform = "scaleX(" + t.fracao.toFixed(4) + ")";
      $("#r-est").textContent = t.acabou ? "Tempo esgotado"
        : t.rodando ? (r.visivel ? "Rodando no telão" : "Rodando, oculto no telão")
        : t.estado === "pausado" ? "Pausado"
        : t.modo === "temporizador" ? "Pronto para iniciar " + P.fmtDuracao(r.duracao) : "Pronto para iniciar";
      pintarPlay($("#r-play"), a);
      $("#r-zerar").disabled = t.estado === "parado";
    }

    // botão da tela inicial
    const home = $("#home-rel");
    if (home) {
      const ativo = t.rodando || t.estado === "pausado";
      home.textContent = ativo ? f.txt : "";
      home.classList.toggle("ativo", t.rodando && !t.acabou);
    }

    // barra fixa nas outras telas
    const mini = $("#mini-rel");
    const mostrar = (r.visivel || t.rodando) && rota !== "cronometro/";
    if (mini.hidden === mostrar) { mini.hidden = !mostrar; document.body.classList.toggle("tem-mini", mostrar); }
    if (mostrar) {
      $("#mr-modo").textContent = t.acabou ? "Esgotado" : t.estado === "pausado" ? "Pausado" : t.modo === "temporizador" ? "Temporizador" : "Cronômetro";
      $("#mr-t").textContent = f.txt;
      mini.classList.toggle("alerta", alerta);
      mini.classList.toggle("fim", t.acabou);
      pintarPlay($("#mr-play"), a);
    }

    // vibra quando o temporizador zera (só se a contagem foi vista rodando)
    const chave = r.inicio + ":" + r.duracao;
    if (t.modo === "temporizador" && t.rodando) {
      const seg = Math.ceil(t.valor / 1000 - 1e-6);
      if (chave === rChave && rSeg !== null && rSeg > 0 && seg === 0) { vibrar([300, 120, 300, 120, 300]); toast("Tempo esgotado"); }
      rSeg = seg;
      rChave = chave;
    } else {
      rSeg = null;
    }
  }
  setInterval(tickRelogio, 100);
  $("#mr-abrir").onclick = () => { location.hash = "#/cronometro"; };
  $("#mr-play").onclick = () => { if (!E || !loja) return; acaoRelogio(P.tempoRelogio(E.relogio, loja.agora())).fn(); vibrar(15); };

          i.onchange = () => { loja.config("equipes/" + i.dataset.nome + "/nome", i.value.trim().slice(0, 30)); toast("Nome da equipe salvo"); };
        });
        $$("[data-logo]").forEach((i) => {
          i.onchange = async () => {
            const f = i.files && i.files[0];
            i.value = "";
            if (!f) return;
            try {
              const url = await P.logoParaDataURL(f);
              loja.config("equipes/" + i.dataset.logo + "/logo", url);
              toast("Logo enviada");
            } catch (e) { toast("Não deu para ler essa imagem. Use PNG, JPG ou SVG."); }
          };
        });
        $$("[data-semlogo]").forEach((b) => (b.onclick = () => { loja.config("equipes/" + b.dataset.semlogo + "/logo", null); toast("Logo removida"); }));
        const eu = $("#a-eu");
        eu.value = meuNome();
        eu.onchange = () => { try { localStorage.setItem("placar:nome", eu.value.trim().slice(0, 20)); } catch (e) {} toast("Seu nome foi salvo neste celular"); };
        $("#lk-telao").textContent = P.linkPara("telao.html", codigo);
        $("#lk-staff").textContent = P.linkPara("staff.html", codigo);
        $$("[data-copiar]").forEach((b) => (b.onclick = () => copiar($("#" + b.dataset.copiar).textContent)));
        $("#zerar").onclick = () => {
          if ((prompt("Isso apaga todos os pontos e penalizações. Digite ZERAR para confirmar.") || "").trim().toUpperCase() === "ZERAR") { loja.zerarPontos(); toast("Pontos zerados"); }
        };
        $("#apagar-tudo").onclick = () => {
          if ((prompt("Isso apaga as brincadeiras e todos os pontos. Digite APAGAR para confirmar.") || "").trim().toUpperCase() === "APAGAR") { loja.apagarTudo(); toast("Brincadeiras e pontos apagados"); }
        };
      },
      atualizar() {
        const foco = document.activeElement;
        const t = $("#a-titulo");
        if (foco !== t) t.value = E.config.titulo;
        $$("[data-nome]").forEach((i) => { if (i !== foco) i.value = nomeEq(i.dataset.nome); });
        $$("[data-prev]").forEach((d) => logoPrev(d, E.config.equipes[d.dataset.prev]));
      },
    },
  };

  /* ---------- rotas ---------- */
  function rotear() {
    if (!E || !loja) return;
    const partes = (location.hash || "#/").split("/");
    let nome = partes[1] || "";
    const id = decodeURIComponent(partes[2] || "");
    if (!telas[nome]) nome = "";
    const chave = nome + "/" + id;
    if (chave !== rota) {
      rota = chave;
      tela = telas[nome];
      tela.montar(id);
      scrollTo(0, 0);
    }
    tela.atualizar(id);
  }
  addEventListener("hashchange", rotear);

  function render(estado) {
    E = estado;
    C = P.computar(E, loja ? loja.agora() : Date.now());
    $("#titulo").textContent = E.config.titulo;
    document.title = "Staff | " + E.config.titulo;
    rotear();
    tickRelogio();
  }

  function conexao(st) {
    if (st === "online") jaConectou = true;
    const txt = { online: "Ao vivo", offline: jaConectou ? "Sem conexão" : "Conectando", demo: "Demonstração", negado: "Sem permissão" }[st] || st;
    const el = $("#conn");
    el.className = "conn " + (st === "offline" && !jaConectou ? "" : st);
    el.lastElementChild.textContent = txt;
    if (st === "offline" && jaConectou) toast("Sem internet. Os lançamentos vão sincronizar quando voltar.");
    if (st === "negado") toast("O Firebase recusou a gravação. Confira as regras e o código da sala.");
  }

  /* ---------- início ---------- */
  const codigo = P.sala();
  if (P.temFirebase() && codigo.length < 10) {
    app.innerHTML = '<div class="msg"><b>Link incompleto</b>Este link não tem o código da sala. Peça ao responsável o link do staff completo (termina com ?sala=...).</div>';
  } else {
    P.telaAcesa();
    P.abrirSala(codigo, { aoMudar: render, aoConectar: conexao })
      .then((l) => { loja = l; if (E) rotear(); })
      .catch(() => { app.innerHTML = '<div class="msg"><b>Não foi possível carregar o Firebase</b>Confira a internet do celular e recarregue a página.</div>'; });
  }
})();
</script>
</body>
</html>
