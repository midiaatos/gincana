<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão do placar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="placar.js"></script>
<style>
  :root{
    --bg:#05070a; --txt:#eef2f6; --mut:#7d8796; --mut2:#454d5a;
    --vidro:rgba(255,255,255,.035); --linha:rgba(255,255,255,.08);
    --g1:#1f5bff; --g2:#0db464;
    --verm:#ff3b4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body.sem-cursor{cursor:none}

  #fundo{position:fixed;inset:0;background:
    radial-gradient(55vw 60vh at 10% 15%, color-mix(in srgb,var(--g1) 22%,transparent), transparent 62%),
    radial-gradient(55vw 60vh at 92% 88%, color-mix(in srgb,var(--g2) 20%,transparent), transparent 62%),
    radial-gradient(35vw 45vh at 50% 40%, rgba(255,255,255,.035), transparent 70%),
    var(--bg)}

  /* palco fixo 1920x1080, escalado para qualquer projetor */
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);
    display:grid;grid-template-rows:56px 590px 1fr 58px;gap:20px;padding:30px 40px 32px}

  /* topo */
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .top-l{display:flex;align-items:baseline;gap:22px;min-width:0}
  #relogio{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
  .titulo{font-size:22px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:flex;align-items:center;gap:14px;height:52px;padding:0 28px;border-radius:999px;
    border:1px solid var(--linha);background:var(--vidro);font-size:20px;color:var(--mut);white-space:nowrap}
  .pill b{color:var(--txt);font-weight:600}
  .pill.vivo{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.06)}
  .ao{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulso 1.6s infinite}
  .top-r{justify-self:end;display:flex;align-items:center;gap:22px}
  .conn{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--mut)}
  .conn i{width:9px;height:9px;border-radius:50%;background:var(--mut2)}
  .conn.online i{background:#34d27b}
  .conn.offline i,.conn.negado i{background:var(--verm)}
  .conn.demo i{background:#f5b83d}

  /* faixa principal */
  .principal{--k:1;--hc:122px;--hl:116px;--nf:50px;display:grid;gap:24px;min-height:0;min-width:0}
  .principal.duelo{grid-template-columns:1fr 352px 1fr}
  .principal.multi{grid-template-columns:minmax(0,1fr) 320px}
  .times{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:16px 18px;min-height:0;min-width:0}
  .lateral{display:grid;min-height:0}
  .equipe{display:grid;grid-template-rows:var(--hc) minmax(0,1fr);gap:calc(14px * var(--k));min-height:0;min-width:0}
  .compacta .equipe{gap:8px}
  .eq-cab{display:flex;align-items:center;justify-content:center;gap:calc(18px * var(--k));min-width:0}
  .logo{width:calc(var(--hl) * .64);height:calc(var(--hl) * .64);flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--tx);font-size:calc(var(--hl) * .28);font-weight:700;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px -14px var(--c)}
  /* logo enviada: sem recorte redondo, sem fundo, tamanho grande respeitando o formato original */
  .logo.img{width:auto;height:var(--hl);max-width:calc(var(--hl) * 2.1);border-radius:0;background:none;box-shadow:none;overflow:visible;display:flex}
  .logo img{width:100%;height:100%;object-fit:contain}
  .logo.img img{width:auto;height:100%;max-width:calc(var(--hl) * 2.1)}
  .eq-nome{flex:0 1 auto;min-width:0;font-size:var(--nf);font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
  .lider{position:absolute;left:22px;top:20px;z-index:1;font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--c2);
    background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
    opacity:0;transform:translateY(4px);transition:opacity .5s,transform .5s}
  .equipe.frente .lider{opacity:1;transform:none}
  .multi .lider{opacity:1;transform:none;color:var(--mut);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
  .multi .equipe.frente .lider{color:var(--c2);background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
  .compacta .lider{left:12px;top:10px;font-size:12px;padding:4px 9px}

  .painel{position:relative;display:grid;place-items:center;border-radius:calc(14px + 16px * var(--k));overflow:hidden;min-height:0;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
    border:1px solid var(--linha);transition:border-color .4s}
  .painel::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 55% at 50% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 70%)}
  /* o medidor é desenhado em 460x418 e escalado por --k conforme o número de equipes */
  .caixa-med{position:relative;width:calc(460px * var(--k));height:calc(418px * var(--k))}
  .mostrador{position:absolute;left:0;top:0;width:460px;height:418px;transform:scale(var(--k));transform-origin:0 0}
  .pequeno .un,.pequeno .rodape{display:none}
  .gauge{width:100%;height:100%;overflow:visible}
  .ticks line{stroke:rgba(255,255,255,.12);stroke-width:2;stroke-linecap:round}
  .ticks line.mj{stroke:rgba(255,255,255,.3)}
  /* arco no estilo medidor de velocidade: traço grosso, pontas retas, degradê limpo, sem neon */
  .trilho{fill:none;stroke:rgba(150,165,210,.10);stroke-width:32;stroke-linecap:butt}
  .progresso{fill:none;stroke-width:32;stroke-linecap:butt;stroke-dasharray:100 100;stroke-dashoffset:100;opacity:0;
    transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),opacity .3s}
  .leitura{position:absolute;left:50%;top:54.5%;transform:translate(-50%,-50%);text-align:center}
  .num{font-size:176px;font-weight:700;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums}
  .num.m{font-size:148px}
  .num.g{font-size:120px}
  .un{margin-top:10px;font-size:17px;letter-spacing:.32em;color:var(--mut);padding-left:.32em}
  .rodape{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:28px;font-size:17px;color:var(--mut);white-space:nowrap}
  .rodape b{color:var(--txt);font-weight:600}
  .delta{position:absolute;right:calc(52px * var(--k));top:calc(70px * var(--k));font-size:max(34px,calc(66px * var(--k)));font-weight:700;color:var(--c2);opacity:0;pointer-events:none;
    text-shadow:0 0 34px var(--c)}
  .delta.neg{color:var(--verm);text-shadow:0 0 34px rgba(255,59,74,.7)}
  .delta.vai{animation:sobe 2.4s cubic-bezier(.2,.8,.2,1)}
  .painel.pulso{animation:brilho 1.5s ease-out}
  .painel.penal{animation:bordaVermelha 2.8s ease-out,tremor .7s ease-in-out}

  /* coluna do meio */
  .centro{display:grid;grid-template-rows:122px auto 1fr;gap:14px;min-height:0}
  .vs{display:grid;place-items:center;font-size:24px;font-weight:300;letter-spacing:.3em;color:var(--mut);padding-left:.3em}
  .disputa{border-radius:24px;border:1px solid var(--linha);background:var(--vidro);padding:22px 24px 20px;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .dif-rot{font-size:16px;color:var(--mut)}
  .dif{font-size:76px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .dif-quem{font-size:17px;color:var(--mut);margin-bottom:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dif-quem[data-eq]{color:var(--c2)}
  .cabo{position:relative;width:100%;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .cabo .ca{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:99px 0 0 99px;
    background:linear-gradient(90deg,var(--c1),var(--c2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .cabo .marco{position:absolute;left:50%;top:-7px;bottom:-7px;width:2px;margin-left:-1px;border-radius:2px;background:rgba(255,255,255,.75)}
  .cabo-pct{width:100%;display:flex;justify-content:space-between;margin-top:8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .cabo-pct span{color:var(--c2)}

  .penal-card{min-height:0;overflow:hidden;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;
    border:1.5px solid var(--verm);background:linear-gradient(180deg,rgba(255,59,74,.09),rgba(255,59,74,.02));
    box-shadow:0 0 44px -18px rgba(255,59,74,.75),inset 0 0 0 1px rgba(255,59,74,.08)}
  .penal-card.pisca{animation:piscaVerm 1.8s ease-out}
  .penal-tit{font-size:19px;font-weight:600;color:var(--verm)}
  .penal-eq{display:flex;align-items:center;gap:12px}
  .penal-eq .nm{flex:1;min-width:0;font-size:18px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .penal-eq b{font-size:32px;font-weight:700;color:var(--verm);font-variant-numeric:tabular-nums}
  .penal-eq b.zero{color:var(--mut2)}
  .dot{width:12px;height:12px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .dot.verm{background:var(--verm)}
  .penal-ult{list-style:none;border-top:1px solid rgba(255,59,74,.2);padding-top:12px;display:flex;flex-direction:column;gap:9px;min-height:0}
  .penal-ult li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mut);min-width:0}
  .penal-ult li b{color:var(--verm);font-weight:700;flex:none}
  .penal-ult li .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .penal-ult li em{font-style:normal;color:var(--mut2);margin-left:8px}
  .penal-ult li.nada{color:var(--mut2)}
  .multi .penal-card{gap:10px}
  .multi .penal-eq .nm{font-size:17px}
  .multi .penal-eq b{font-size:26px}
  .penal-card.muitas .penal-ult li:nth-child(n+3){display:none}

  /* brincadeiras */
  .jogos{display:grid;gap:16px;justify-content:center;min-height:0}
  .jogos.compacto{gap:12px;justify-content:stretch}
  .vazio-txt{align-self:center;justify-self:center;font-size:20px;color:var(--mut2)}
  .jogo{position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:22px;padding:18px 22px 16px;
    display:flex;flex-direction:column;gap:10px;border:1px solid var(--linha);background:var(--vidro);
    transition:border-color .5s,background .5s,box-shadow .5s}
  .jogo header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
  .jogo h3{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st{flex:none;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut2)}
  .jogo.vivo{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.065);box-shadow:0 0 50px -24px rgba(255,255,255,.6)}
  .jogo.vivo .st{color:var(--txt)}
  .jogo.vivo .st::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulso 1.6s infinite}
  .jogo[data-fim="1"]{border-color:color-mix(in srgb,var(--cf) 60%,transparent);box-shadow:inset 0 -40px 60px -50px var(--cf)}
  .fichas{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
  .ficha{position:relative;min-width:0;display:grid;place-items:center;border-radius:12px;overflow:hidden;
    background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);transition:opacity .5s,box-shadow .5s}
  .ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--c2),var(--c1))}
  .ficha .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ficha.perdeu{opacity:.38}
  .ficha.venceu{box-shadow:inset 0 0 0 2px var(--c)}
  .ficha.bate{animation:bate .6s ease-out}
  .jogos.compacto .fichas{gap:5px}
  .jogos.compacto .ficha{border-radius:8px}
  .jogos.compacto .ficha .n{font-size:18px}
  .aneis{flex:1;min-height:0;display:flex;justify-content:space-around;align-items:center;gap:8px}
  .anel{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;transition:opacity .5s}
  .anel.perdeu{opacity:.38}
  .aro{position:relative;width:116px;height:116px}
  .aro svg{width:100%;height:100%;transform:rotate(-90deg)}
  .aro .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:9}
  .aro .prg{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;opacity:0;
    transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),opacity .3s;filter:drop-shadow(0 0 6px var(--c))}
  .aro .n{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .anel .lbl{font-size:14px;color:var(--mut);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .anel.bate .aro{animation:bate .6s ease-out}
  .jogos.compacto .jogo{padding:11px 16px;gap:4px;border-radius:18px}
  .jogos.compacto .jogo h3{font-size:18px}
  .jogos.compacto .aro{width:62px;height:62px}
  .jogos.compacto .aro .n{font-size:22px}
  .jogos.compacto .anel .lbl{display:none}

  /* faixa inferior: brincadeiras ou cronômetro */
  .faixa{display:grid;min-height:0}
  .faixa>.jogos,.faixa>.rel{grid-area:1/1;min-height:0;transition:opacity .45s ease,transform .45s ease}
  .faixa>.rel{opacity:0;transform:translateY(14px);pointer-events:none}
  .faixa.com-rel>.jogos{opacity:0;transform:translateY(14px);pointer-events:none}
  .faixa.com-rel>.rel{opacity:1;transform:none}
  .rel{display:grid;grid-template-columns:1fr 840px 1fr;gap:16px}
  .rel-lado{position:relative;overflow:hidden;min-width:0;border-radius:22px;border:1px solid var(--linha);background:var(--vidro);
    display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 20px;transition:opacity .4s}
  .rel.sem-jogo .rel-lado{opacity:0}
  .rl{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px}
  .rel.duelo .rl{flex:1}
  .rel.duelo .rl::before{content:"";position:absolute;inset:-10px -20px;pointer-events:none;
    background:radial-gradient(80% 70% at 50% 110%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
  .rl-nome{font-size:20px;color:var(--mut);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rl-n{font-size:112px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--c2);font-variant-numeric:tabular-nums}
  .rel.multi .rl{flex:1;flex-direction:row;justify-content:space-between;gap:14px;padding:0 6px}
  .rel.multi .rl-nome{display:flex;align-items:center;gap:10px;font-size:18px}
  .rel.multi .rl-nome::before{content:"";width:12px;height:12px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .rel.multi .rl-n{font-size:clamp(26px,calc(150px / var(--ql)),56px)}
  .rl.pulso{animation:brilho 1.5s ease-out}
  .rel-centro{position:relative;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 44px 20px;transition:border-color .4s,box-shadow .4s}
  .rel-topo{display:flex;align-items:center;gap:14px;font-size:20px;color:var(--mut);max-width:100%;white-space:nowrap}
  .rel-topo b{color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .rel-st{padding:4px 12px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);color:var(--txt)}
  .rel-st:empty{display:none}
  .rel-tempo{display:flex;align-items:baseline;justify-content:center;line-height:.9}
  .rel-tempo b{font-size:160px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .3s,opacity .3s}
  .rel-tempo small{font-size:64px;font-weight:600;color:var(--mut);margin-left:4px;font-variant-numeric:tabular-nums}
  .rel-tempo small:empty{display:none}
  .rel-barra{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .rel-barra i{display:block;height:100%;width:100%;border-radius:inherit;background:#eef2f6;transform-origin:left center;transition:background .3s}
  .rel.cron .rel-barra{display:none}
  .rel.pausado .rel-tempo b{opacity:.5}
  .rel.alerta .rel-tempo b{color:var(--verm)}
  .rel.alerta .rel-barra i{background:var(--verm)}
  .rel.alerta .rel-centro{border-color:rgba(255,59,74,.6)}
  .rel.fim .rel-centro{border-color:var(--verm);animation:fimPisca 1s ease-in-out infinite}
  .rel.fim .rel-tempo b{color:var(--verm)}
  .rel.fim .rel-st{background:var(--verm);color:#fff}
  .som{display:none;font-size:15px;color:#f5b83d}
  .som.ver{display:inline}
  body.sem-cursor .som{display:none}

  /* barra inferior com o último lançamento */
  .dock{justify-self:center;align-self:center;width:1180px;max-width:100%;height:58px;border-radius:20px;border:1px solid var(--linha);
    background:rgba(255,255,255,.04);display:flex;align-items:center;gap:18px;padding:0 26px;font-size:19px;color:var(--mut)}
  .dock .ev{flex:1;min-width:0;display:flex;align-items:center;gap:14px;white-space:nowrap;overflow:hidden}
  .dock .ev>span:last-child{overflow:hidden;text-overflow:ellipsis}
  .dock b{color:var(--txt);font-weight:600}
  .dock b.cor{color:var(--c2)}
  .dock b.verm{color:var(--verm)}
  .dock .q{flex:none;font-size:16px;color:var(--mut2);font-variant-numeric:tabular-nums}
  .dock.novo .ev{animation:entra .6s cubic-bezier(.2,.8,.2,1)}

  #flash{position:fixed;inset:0;pointer-events:none}
  #flash.vai{animation:flash 1.7s ease-out}

  #aviso{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);max-width:min(90vw,880px);padding:18px 26px;border-radius:18px;
    background:rgba(20,22,28,.92);border:1px solid rgba(255,255,255,.12);font-size:clamp(14px,1.3vw,20px);color:var(--mut);
    display:flex;flex-direction:column;gap:6px;text-align:center}
  #aviso b{color:var(--txt)}
  #aviso[hidden]{display:none}

  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  @keyframes sobe{0%{opacity:0;transform:translateY(30px) scale(.8)}14%{opacity:1;transform:translateY(0) scale(1.06)}70%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-26px)}}
  @keyframes brilho{0%{box-shadow:0 0 0 2px var(--c),0 0 90px -10px var(--c)}100%{box-shadow:0 0 0 0 transparent,0 0 0 0 transparent}}
  @keyframes bordaVermelha{0%,55%{border-color:var(--verm);box-shadow:0 0 0 2px var(--verm),0 0 90px -10px rgba(255,59,74,.75)}100%{border-color:var(--linha);box-shadow:0 0 0 0 transparent}}
  @keyframes tremor{0%,100%{transform:none}10%,30%,50%{transform:translateX(-7px)}20%,40%{transform:translateX(7px)}60%{transform:none}}
  @keyframes piscaVerm{0%{background:rgba(255,59,74,.32);box-shadow:0 0 90px -10px rgba(255,59,74,.9)}100%{}}
  @keyframes flash{0%{box-shadow:inset 0 0 180px 34px rgba(255,59,74,.55)}100%{box-shadow:inset 0 0 0 0 rgba(255,59,74,0)}}
  @keyframes bate{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes fimPisca{0%,100%{box-shadow:0 0 0 2px var(--verm),0 0 90px -10px rgba(255,59,74,.8)}50%{box-shadow:0 0 0 1px rgba(255,59,74,.4),0 0 30px -10px rgba(255,59,74,.3)}}
  @keyframes entra{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .painel.penal{animation:bordaVermelha 2.8s ease-out}
    #flash.vai{animation:none}
    .rel.fim .rel-centro{animation:none;box-shadow:0 0 0 2px var(--verm)}
  }
</style>
</head>
<body class="sem-cursor">
<div id="fundo"></div>
<div id="stage"></div>
<div id="flash"></div>
<div id="aviso" hidden></div>

<script>
(function () {
  "use strict";
  const P = window.Placar;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ---------- medidor ---------- */
  const ARCO = "M 98.38 339.62 A 172 172 0 1 1 341.62 339.62";
  const TICKS = (() => {
    let s = "";
    for (let i = 0; i <= 27; i++) {
      const a = (135 + i * 10) * Math.PI / 180, mj = i % 9 === 0, r1 = mj ? 194 : 199, r2 = 207;
      s += '<line class="' + (mj ? "mj" : "") + '" x1="' + (220 + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (218 + r1 * Math.sin(a)).toFixed(1) +
        '" x2="' + (220 + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (218 + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    return s;
  })();
  let seqGrad = 0;
  function secaoEquipe(id) {
    const g = "g" + (++seqGrad);
    return `<section class="equipe" data-eq="${id}">
      <div class="eq-cab"><div class="logo"></div><h2 class="eq-nome"></h2></div>
      <div class="painel">
        <span class="lider"></span>
        <div class="caixa-med"><div class="mostrador">
          <svg class="gauge" viewBox="0 0 440 400" aria-hidden="true">
            <defs>
              <linearGradient id="arco-${g}" class="grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"/><stop offset="0.5"/><stop offset="1"/>
              </linearGradient>
              <radialGradient id="miolo-${g}" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
              </radialGradient>
            </defs>
            <circle cx="220" cy="218" r="156" fill="url(#miolo-${g})"/>
            <g class="ticks">${TICKS}</g>
            <path class="trilho" d="${ARCO}"/>
            <path class="progresso" d="${ARCO}" pathLength="100" stroke="url(#arco-${g})"/>
          </svg>
          <div class="leitura"><div class="num" data-v="0">0</div><div class="un">PONTOS</div></div>
          <div class="rodape"><span class="r-vit"></span><span class="r-pct"></span></div>
        </div></div>
        <div class="delta"></div>
      </div>
    </section>`;
  }
  function cardPenal(ids) {
    return `<div class="penal-card${ids.length > 5 ? " muitas" : ""}" id="penal">
      <div class="penal-tit">Penalizações</div>
      ${ids.map((id) => `<div class="penal-eq" data-eq="${id}"><span class="dot"></span><span class="nm"></span><b class="zero">0</b></div>`).join("")}
      <ul class="penal-ult" id="penal-ult"></ul>
    </div>`;
  }
  // tamanho do medidor, do cabeçalho e do nome conforme a quantidade de equipes
  function layout(n) {
    if (n <= 3) return { cols: 3, rows: 1, k: 0.92, hc: 104, hl: 92, nf: 46, peq: false };
    if (n === 4) return { cols: 4, rows: 1, k: 0.72, hc: 96, hl: 84, nf: 38, peq: true };
    if (n <= 6) return { cols: 3, rows: 2, k: 0.5, hc: 46, hl: 40, nf: 26, peq: true };
    return { cols: 4, rows: 2, k: 0.5, hc: 46, hl: 40, nf: 26, peq: true };
  }

  /* ---------- palco ---------- */
  $("#stage").innerHTML = `
    <header class="top">
      <div class="top-l"><span id="relogio">--:--</span><span id="titulo" class="titulo"></span></div>
      <div class="pill" id="pill"></div>
      <div class="top-r"><span class="som" id="som">Som do temporizador desligado: clique na tela</span><span class="conn" id="conn"><i></i><span>Conectando</span></span></div>
    </header>
    <main class="principal" id="principal"></main>
    <section class="faixa" id="faixa">
      <div class="jogos" id="jogos"></div>
      <div class="rel cron" id="rel">
        <div class="rel-lado" id="rel-e"></div>
        <div class="rel-centro">
          <div class="rel-topo"><span id="rel-modo">Cronômetro</span><b id="rel-jogo"></b><span class="rel-st" id="rel-st"></span></div>
          <div class="rel-tempo"><b id="rel-t">00:00</b><small id="rel-d"></small></div>
          <div class="rel-barra"><i id="rel-barra"></i></div>
        </div>
        <div class="rel-lado" id="rel-d2"></div>
      </div>
    </section>
    <footer class="dock" id="dock"><span class="ev" id="dock-ev"></span><span class="q" id="dock-q"></span></footer>`;

  /* ---------- escala, relógio, tela cheia, cursor ---------- */
  const stage = $("#stage");
  function encaixar() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }
  addEventListener("resize", encaixar);
  encaixar();

  const relogio = () => ($("#relogio").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }));
  relogio();
  setInterval(relogio, 5000);

  function telaCheia() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen && document.exitFullscreen();
  }
  addEventListener("dblclick", telaCheia);
  addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") telaCheia(); });

  let tCursor;
  addEventListener("mousemove", () => {
    document.body.classList.remove("sem-cursor");
    clearTimeout(tCursor);
    tCursor = setTimeout(() => document.body.classList.add("sem-cursor"), 2500);
  });

  P.telaAcesa();

  /* ---------- helpers de desenho ---------- */
  const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function numero(el, alvo, f) {
    f = f || P.fmt;
    const de = Number(el.dataset.v || 0);
    el.dataset.v = alvo;
    cancelAnimationFrame(el._raf);
    if (de === alvo || reduzido) { el.textContent = f(alvo); return; }
    const t0 = performance.now(), dur = 850;
    const passo = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = f(Math.round(de + (alvo - de) * e));
      if (k < 1) el._raf = requestAnimationFrame(passo);
    };
    el._raf = requestAnimationFrame(passo);
  }
  function preencher(el, pct) {
    const p = Math.max(0, Math.min(100, pct));
    el.style.strokeDashoffset = String(100 - p);
    el.style.opacity = p > 0.3 ? "1" : "0";
  }
  function reiniciar(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  // diminui a fonte do nome até caber ao lado da logo (até 60% do tamanho base)
  function ajustarNome(el) {
    el.style.fontSize = "";
    const base = parseFloat(getComputedStyle(el).fontSize) || 50;
    let fs = base;
    while (el.scrollWidth > el.clientWidth + 1 && fs > base * 0.6) { fs -= 2; el.style.fontSize = fs + "px"; }
  }
  const ajustarNomes = () => $$(".eq-nome").forEach(ajustarNome);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarNomes);

  function logo(el, eq) {
    const chave = eq.logo ? "img:" + eq.logo.length + eq.logo.slice(-24) : "txt:" + eq.nome;
    if (el.dataset.k === chave) return;
    el.dataset.k = chave;
    if (eq.logo) {
      el.classList.add("img");
      el.innerHTML = '<img alt="">';
      el.firstChild.onload = ajustarNomes;
      el.firstChild.src = eq.logo;
    } else {
      el.classList.remove("img");
      el.textContent = (eq.nome.trim()[0] || "?").toUpperCase();
    }
  }

  /* ---------- estado ---------- */
  let loja = null, E = null, C = null, vistos = null, ultimoDock, chavePill = "", jaConectou = false, estrutura = "";
  const secoes = new Map(), cards = new Map();
  const nome = (id) => E.config.equipes[id].nome;
  const pal = (id) => E.config.equipes[id].pal;

  /* Monta a faixa principal quando muda a lista de equipes (2 = duelo; 3 a 8 = grade) */
  function montarEstrutura() {
    const ids = C.ids, n = ids.length, chave = ids.join(",");
    if (chave === estrutura) return;
    estrutura = chave;
    const pr = $("#principal");
    secoes.clear();
    pr.removeAttribute("style");
    if (n === 2) {
      pr.className = "principal duelo";
      pr.innerHTML = secaoEquipe(ids[0]) + `
        <section class="centro">
          <div class="vs">VS</div>
          <div class="disputa">
            <span class="dif-rot">Diferença</span>
            <b class="dif" id="dif" data-v="0">0</b>
            <span class="dif-quem" id="dif-quem">Empate</span>
            <div class="cabo" data-eq="${ids[1]}"><i class="ca" data-eq="${ids[0]}"></i><span class="marco"></span></div>
            <div class="cabo-pct"><span id="pct-1" data-eq="${ids[0]}">0%</span><span id="pct-2" data-eq="${ids[1]}">0%</span></div>
          </div>
          ${cardPenal(ids)}
        </section>` + secaoEquipe(ids[1]);
    } else {
      const L = layout(n);
      pr.className = "principal multi" + (L.rows > 1 ? " compacta" : "") + (L.peq ? " pequeno" : "");
      pr.style.cssText = `--k:${L.k};--hc:${L.hc}px;--hl:${L.hl}px;--nf:${L.nf}px`;
      pr.innerHTML = `<div class="times" style="--cols:${L.cols};--rows:${L.rows}">${ids.map(secaoEquipe).join("")}</div>
        <aside class="lateral">${cardPenal(ids)}</aside>`;
    }
    $$(".equipe", pr).forEach((sec) => secoes.set(sec.dataset.eq, sec));

    // brincadeiras e cronômetro também dependem das equipes
    cards.clear();
    $("#jogos").innerHTML = "";
    const meio = Math.ceil(n / 2), item = (id) => `<div class="rl" data-eq="${id}"><span class="rl-nome"></span><b class="rl-n" data-v="0">0</b></div>`;
    const rel = $("#rel");
    rel.classList.toggle("duelo", n === 2);
    rel.classList.toggle("multi", n > 2);
    rel.style.setProperty("--ql", String(meio));
    $("#rel-e").innerHTML = ids.slice(0, meio).map(item).join("");
    $("#rel-d2").innerHTML = ids.slice(meio).map(item).join("");
    vistos = null; // não anima a reconstrução
  }

  function render(estado) {
    E = estado;
    const agora = loja ? loja.agora() : Date.now();
    C = P.computar(E, agora);
    P.aplicarCores(E);
    montarEstrutura();

    const novos = vistos ? C.L.filter((l) => !vistos.has(l.id) && agora - l.ts < 20000) : [];
    vistos = new Set(C.L.map((l) => l.id));

    $("#titulo").textContent = E.config.titulo;
    document.title = E.config.titulo + " | Telão";
    const fundo = $("#fundo").style;
    fundo.setProperty("--g1", pal(C.ids[0]).c);
    fundo.setProperty("--g2", pal(C.ids[C.ids.length - 1]).c);

    const ids = C.ids, n = ids.length;
    const pos = {};
    let soma = 0;
    for (const id of ids) { pos[id] = Math.max(0, C.total[id]); soma += pos[id]; }

    for (const id of ids) {
      const sec = secoes.get(id);
      const k = pal(id);
      $$(".grad stop", sec).forEach((st, i) => st.setAttribute("stop-color", k.arco[i]));
      const nomeEl = $(".eq-nome", sec);
      if (nomeEl.textContent !== nome(id)) nomeEl.textContent = nome(id);
      logo($(".logo", sec), E.config.equipes[id]);
      ajustarNome(nomeEl);
      const num = $(".num", sec), dig = P.fmt(C.total[id]).length;
      num.classList.toggle("m", dig === 3);
      num.classList.toggle("g", dig >= 4);
      numero(num, C.total[id]);
      const share = soma ? pos[id] / soma : 0;
      preencher($(".progresso", sec), share * 100);
      const v = C.vitorias[id];
      $(".r-vit", sec).innerHTML = "<b>" + v + "</b> " + (v === 1 ? "vitória" : "vitórias");
      $(".r-pct", sec).innerHTML = "<b>" + Math.round(share * 100) + "%</b> dos pontos";
      sec.classList.toggle("frente", C.lider === id);
      $(".lider", sec).textContent = n === 2 ? "Na frente" : C.posicao[id] + "º lugar";
    }

    if (n === 2) {
      const [x, y] = ids, d = C.total[x] - C.total[y];
      numero($("#dif"), Math.abs(d));
      const quem = $("#dif-quem");
      quem.textContent = d === 0 ? "Empate" : nome(d > 0 ? x : y) + " na frente";
      if (d === 0) quem.removeAttribute("data-eq"); else quem.dataset.eq = d > 0 ? x : y;
      const shareA = soma ? pos[x] / soma : 0.5;
      $(".cabo .ca").style.width = shareA * 100 + "%";
      $("#pct-1").textContent = soma ? Math.round(shareA * 100) + "%" : "0%";
      $("#pct-2").textContent = soma ? 100 - Math.round(shareA * 100) + "%" : "0%";
    }

    // penalizações
    for (const id of ids) {
      const pe = $('.penal-eq[data-eq="' + id + '"]');
      if (!pe) continue;
      $(".nm", pe).textContent = nome(id);
      const b = $("b", pe);
      b.textContent = C.penal[id] ? P.sinal(-C.penal[id]) : "0";
      b.classList.toggle("zero", !C.penal[id]);
    }
    const ult = C.L.filter((l) => l.tipo === "penal").slice(-3).reverse();
    $("#penal-ult").innerHTML = ult.length
      ? ult.map((l) => `<li data-eq="${l.equipe}"><span class="dot"></span><b>${P.sinal(l.pontos)}</b><span class="t">${P.esc(nome(l.equipe))}${l.motivo ? "<em>" + P.esc(l.motivo) + "</em>" : ""}</span></li>`).join("")
      : '<li class="nada">Nenhuma penalização</li>';

    // pílula do topo
    const nomeVivo = C.aoVivo ? E.jogos[C.aoVivo].nome : "";
    const chave = nomeVivo ? "v:" + nomeVivo : "-";
    if (chavePill !== chave) {
      chavePill = chave;
      const pill = $("#pill");
      pill.classList.toggle("vivo", !!nomeVivo);
      pill.innerHTML = nomeVivo
        ? '<span class="ao"></span><span>Agora</span><b>' + P.esc(nomeVivo) + "</b>"
        : "<span>Aguardando a próxima brincadeira</span>";
    }

    renderJogos();
    renderRelogio();
    renderDock();
    animar(novos);
  }

  /* ---------- cartões das brincadeiras ---------- */
  function criarCard() {
    const ids = C.ids, el = document.createElement("article");
    el.className = "jogo";
    let corpo;
    if (ids.length === 2) {
      corpo = '<div class="aneis">' + ids.map((id) => `<div class="anel" data-eq="${id}"><div class="aro"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="50"/><circle class="prg" cx="60" cy="60" r="50" pathLength="100"/></svg><b class="n" data-v="0">0</b></div><span class="lbl"></span></div>`).join("") + "</div>";
    } else {
      const n = ids.length, cols = n <= 4 ? n : n <= 6 ? 3 : 4; // 6 equipes = 3+3, 8 = 4+4
      corpo = `<div class="fichas" style="--n:${cols}">` + ids.map((id) => `<div class="ficha" data-eq="${id}"><b class="n" data-v="0">0</b></div>`).join("") + "</div>";
    }
    el.innerHTML = '<header><h3></h3><span class="st"></span></header>' + corpo;
    return el;
  }

  function renderJogos() {
    const box = $("#jogos"), n = C.jogos.length, ids = C.ids;
    if (!n) {
      cards.clear();
      box.className = "jogos";
      box.style.gridTemplateColumns = "";
      box.style.gridTemplateRows = "";
      box.innerHTML = '<p class="vazio-txt">As brincadeiras cadastradas pelo staff aparecem aqui</p>';
      return;
    }
    const compacto = n > 6;
    const cols = compacto ? Math.ceil(n / 2) : n;
    box.className = "jogos" + (compacto ? " compacto" : "");
    box.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, " + (compacto ? "1fr" : "420px") + "))";
    box.style.gridTemplateRows = "repeat(" + (compacto ? 2 : 1) + ", minmax(0, 1fr))";

    const atuais = new Set(C.jogos.map((j) => j.id));
    for (const [id, el] of cards) if (!atuais.has(id)) { el.remove(); cards.delete(id); }
    const desejado = C.jogos.map((j) => {
      let el = cards.get(j.id);
      if (!el) { el = criarCard(); cards.set(j.id, el); }
      return el;
    });
    const filhos = Array.from(box.children);
    if (filhos.length !== desejado.length || desejado.some((el, i) => filhos[i] !== el)) box.replaceChildren.apply(box, desejado);

    for (const j of C.jogos) {
      const el = cards.get(j.id);
      $("h3", el).textContent = j.nome;
      const vivo = j.id === C.aoVivo, fim = j.status === "encerrado";
      el.classList.toggle("vivo", vivo);
      el.dataset.fim = fim && j.vencedor ? "1" : "";
      if (fim && j.vencedor) el.style.setProperty("--cf", pal(j.vencedor).c);
      $(".st", el).textContent = vivo ? "Ao vivo" : fim ? (j.vencedor ? "Encerrada" : "Empate") : "Aguardando";
      const max = Math.max(1, ...ids.map((id) => j.pts[id]));
      for (const id of ids) {
        const perdeu = fim && !!j.vencedor && j.vencedor !== id;
        if (ids.length === 2) {
          const anel = $('.anel[data-eq="' + id + '"]', el);
          numero($(".n", anel), j.pts[id]);
          preencher($(".prg", anel), (Math.max(0, j.pts[id]) / max) * 100);
          $(".lbl", anel).textContent = nome(id);
          anel.classList.toggle("perdeu", perdeu);
        } else {
          const f = $('.ficha[data-eq="' + id + '"]', el);
          numero($(".n", f), j.pts[id]);
          f.classList.toggle("perdeu", perdeu);
          f.classList.toggle("venceu", fim && j.vencedor === id);
        }
      }
    }
  }

  /* ---------- barra do último lançamento ---------- */
  function renderDock() {
    const l = C.L[C.L.length - 1];
    const ev = $("#dock-ev"), q = $("#dock-q"), dock = $("#dock");
    if (!l) {
      ev.innerHTML = "<span>Nenhum ponto lançado ainda</span>";
      q.textContent = "";
      ultimoDock = null;
      return;
    }
    const jogo = l.jogo && E.jogos[l.jogo] ? E.jogos[l.jogo].nome : "";
    ev.innerHTML = l.tipo === "penal"
      ? `<span class="dot verm"></span><span>Penalização de <b class="verm">${P.sinal(l.pontos)}</b> para <b>${P.esc(nome(l.equipe))}</b>${l.motivo ? " (" + P.esc(l.motivo) + ")" : ""}</span>`
      : `<span class="dot" data-eq="${l.equipe}"></span><span><b class="cor" data-eq="${l.equipe}">${P.sinal(l.pontos)}</b> para <b>${P.esc(nome(l.equipe))}</b>${jogo ? " em " + P.esc(jogo) : ""}</span>`;
    q.textContent = P.haQuanto((loja ? loja.agora() : Date.now()) - l.ts);
    if (ultimoDock !== undefined && ultimoDock !== l.id) reiniciar(dock, "novo");
    ultimoDock = l.id;
  }
  setInterval(() => C && renderDock(), 5000);

  /* ---------- animações de lançamento ---------- */
  function animar(novos) {
    if (!novos.length || novos.length > 8) return;
    const por = {};
    for (const l of novos) {
      const p = por[l.equipe] || (por[l.equipe] = { soma: 0, penal: false, jogos: new Set() });
      p.soma += l.pontos;
      if (l.tipo === "penal") p.penal = true;
      if (l.jogo) p.jogos.add(l.jogo);
    }
    for (const id in por) {
      const p = por[id], sec = secoes.get(id);
      if (!sec) continue;
      const painel = $(".painel", sec), delta = $(".delta", sec);
      delta.textContent = P.sinal(p.soma);
      delta.classList.toggle("neg", p.soma < 0);
      reiniciar(delta, "vai");
      painel.classList.remove("pulso", "penal");
      if (p.penal) {
        reiniciar(painel, "penal");
        reiniciar($("#penal"), "pisca");
        reiniciar($("#flash"), "vai");
      } else {
        reiniciar(painel, "pulso");
      }
      p.jogos.forEach((jid) => {
        const card = cards.get(jid);
        if (card) reiniciar($('.anel[data-eq="' + id + '"], .ficha[data-eq="' + id + '"]', card), "bate");
        if (jid === C.aoVivo && E.relogio.visivel) reiniciar($('#rel .rl[data-eq="' + id + '"]'), "pulso");
      });
    }
  }

  /* ---------- cronômetro e temporizador ---------- */
  const faixa = $("#faixa"), rel = $("#rel"), relT = $("#rel-t"), relD = $("#rel-d"), relSt = $("#rel-st"), relBarra = $("#rel-barra");

  function renderRelogio() {
    const r = E.relogio;
    faixa.classList.toggle("com-rel", r.visivel);
    rel.classList.toggle("cron", r.modo !== "temporizador");
    $("#rel-modo").textContent = r.modo === "temporizador" ? "Temporizador" : "Cronômetro";
    const j = C.aoVivo ? C.jogos.find((x) => x.id === C.aoVivo) : null;
    $("#rel-jogo").textContent = j ? j.nome : "";
    rel.classList.toggle("sem-jogo", !j);
    for (const id of C.ids) {
      const it = $('#rel .rl[data-eq="' + id + '"]');
      if (!it) continue;
      $(".rl-nome", it).textContent = nome(id);
      numero($(".rl-n", it), j ? j.pts[id] : 0);
    }
    tickRelogio(true);
  }

  // som do temporizador (o navegador só libera depois de um clique ou tecla no telão)
  let audio = null;
  function liberarSom() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) {}
  }
  addEventListener("click", liberarSom);
  addEventListener("keydown", liberarSom);
  const somLiberado = () => !!audio && audio.state === "running";
  function bip(freq, dur, vol) {
    if (!somLiberado()) return;
    const t0 = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(audio.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
  function alarme() {
    [0, 280, 560].forEach((ms) => setTimeout(() => bip(988, 0.2, 0.5), ms));
    setTimeout(() => bip(740, 1.2, 0.5), 860);
  }

  let ultimoSeg = null, chaveSeg = "";
  function tickRelogio(forcar) {
    if (E && (E.relogio.visivel || forcar === true)) {
      const t = P.tempoRelogio(E.relogio, loja ? loja.agora() : Date.now());
      const f = P.fmtRelogio(t.valor, t.modo);
      if (relT.textContent !== f.txt) relT.textContent = f.txt;
      const d = f.dec ? "," + f.dec : "";
      if (relD.textContent !== d) relD.textContent = d;
      rel.classList.toggle("alerta", t.modo === "temporizador" && t.rodando && !t.acabou && t.valor <= 10000);
      rel.classList.toggle("fim", t.acabou);
      rel.classList.toggle("pausado", t.estado === "pausado" && !t.acabou);
      relBarra.style.transform = "scaleX(" + t.fracao.toFixed(4) + ")";
      const st = t.acabou ? "Tempo esgotado" : t.estado === "pausado" ? "Pausado" : "";
      if (relSt.textContent !== st) relSt.textContent = st;

      // bipes nos 3 últimos segundos e alarme no fim, só para quem viu a contagem acontecer
      const chave = E.relogio.inicio + ":" + E.relogio.duracao;
      if (t.modo === "temporizador" && t.rodando && E.relogio.visivel) {
        const seg = Math.ceil(t.valor / 1000 - 1e-6);
        if (chave === chaveSeg && ultimoSeg !== null && seg < ultimoSeg) {
          if (seg >= 1 && seg <= 3) bip(880, 0.13, 0.35);
          if (seg === 0) alarme();
        }
        ultimoSeg = seg;
        chaveSeg = chave;
      } else {
        ultimoSeg = null;
      }
      $("#som").classList.toggle("ver", E.relogio.visivel && E.relogio.modo === "temporizador" && !somLiberado());
    }
    if (forcar !== true) requestAnimationFrame(tickRelogio);
  }
  requestAnimationFrame(tickRelogio);

  /* ---------- conexão e avisos ---------- */
  function aviso(html) {
    const a = $("#aviso");
    a.innerHTML = html || "";
    a.hidden = !html;
  }
  function conexao(st) {
    if (st === "online") { jaConectou = true; aviso(""); }
    const txt = {
      online: "Ao vivo",
      offline: jaConectou ? "Sem conexão, reconectando" : "Conectando",
      demo: "Modo demonstração",
      negado: "Sem permissão no Firebase",
    }[st] || st;
    const el = $("#conn");
    el.className = "conn " + (st === "offline" && !jaConectou ? "" : st);
    el.lastElementChild.textContent = txt;
    if (st === "negado") aviso("<b>Sem permissão no Firebase.</b><span>Publique as regras novas (database.rules.json) e confira se o código da sala no link tem pelo menos 10 caracteres.</span>");
  }

  /* ---------- início ---------- */
  const codigo = P.sala();
  if (P.temFirebase() && codigo.length < 10) {
    aviso("<b>Link sem o código da sala.</b><span>Abra o telão pelo link gerado na página inicial (termina com ?sala=...).</span>");
  } else {
    P.abrirSala(codigo, { aoMudar: render, aoConectar: conexao })
      .then((l) => { loja = l; })
      .catch(() => aviso("<b>Não foi possível carregar o Firebase.</b><span>Confira a internet deste computador e recarregue a página.</span>"));
    if (P.temFirebase()) {
      setTimeout(() => {
        if (!jaConectou) aviso("<b>Ainda sem conexão com o Firebase.</b><span>Confira a internet deste computador e o campo databaseURL no config.js.</span>");
      }, 12000);
    }
  }
})();
</script>
</body>
</html>
